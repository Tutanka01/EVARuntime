name: CI

on:
  push:
  pull_request:

# Chaque composant (gateway/, node_agent/) utilise
# volontairement des noms de modules top-level identiques (config, database,
# auth, schemas) — cf. AGENTS.md. Ils ne doivent JAMAIS être installés ou
# testés dans le même process pytest. Chaque job ci-dessous est isolé : son
# propre environnement Python, son propre pip install, son propre process
# ruff/pytest, limité au sous-répertoire du composant.
jobs:
  gateway:
    name: gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            gateway/requirements.lock
            requirements-dev.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r gateway/requirements.lock -r requirements-dev.lock

      - name: Lint (ruff)
        run: cd gateway && ruff check .

      - name: Test (pytest)
        run: cd gateway && python -m pytest tests -v

  node_agent:
    name: node_agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            node_agent/requirements.lock
            requirements-dev.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r node_agent/requirements.lock -r requirements-dev.lock

      - name: Lint (ruff)
        run: cd node_agent && ruff check .

      - name: Test (pytest)
        run: cd node_agent && python -m pytest tests -v

  deployment-scripts:
    name: deployment-scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse Bash scripts
        run: |
          bash -n gateway/deploy/*.sh
          bash -n gateway/deploy-macos/*.sh
          bash -n node_agent/deploy/*.sh

      - name: Test local and cluster mode selection
        run: bash gateway/deploy/test-deploy-modes.sh

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install pinned audit toolchain
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Audit runtime dependencies (blocking)
        run: python scripts/dependency_audit.py
