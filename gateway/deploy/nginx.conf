# /etc/nginx/sites-available/llm-gateway
#
# Points critiques SSE (streaming) :
#   proxy_buffering off       — désactive le buffer nginx côté réponse
#   X-Accel-Buffering: no     — désactive le buffer nginx côté upstream
#   chunked_transfer_encoding — nécessaire pour le streaming HTTP/1.1
#   proxy_read_timeout 900s   — voir « Dimensionnement des timeouts » ci-dessous
#
# Dimensionnement des timeouts (COR-009) — DÉRIVÉ DU REGISTRE, pas d'un chiffre
# arbitraire. `ServerManager.ensure_loaded` attend `load_timeout_seconds + 10`
# (`MODEL_LOAD_TIMEOUT_SECONDS`, 180s, quand le modèle ne le surcharge pas). Le
# proxy doit couvrir cette attente, sinon le client reçoit 504 alors que le
# chargement RÉUSSIT côté serveur.
#   gateway/models.yaml, pire entrée ACTIVÉE  : gemma-4-26b-a4b, 300s → 310s
#   gateway/models.yaml, pire entrée TOUTES   : minimax-m2.7,    600s → 610s
#                                               (enabled: false, réactivable)
#   valeur retenue                            : 900s (≈ +48 % sur 610s)
# La marge couvre donc la réactivation de minimax-m2.7 sans retoucher nginx, et
# un stockage plus lent que prévu. `gateway/doctor.py` (contrôle
# `nginx_timeouts`) recalcule l'exigence depuis le registre et signale l'écart si
# un futur modèle dépasse ces 900s ; le test
# `tests/test_nginx_conf.py::test_les_timeouts_livres_couvrent_le_registre`
# échoue dans le même cas.
#
# Sécurité :
#   /admin/ est restreint au réseau campus (10.x.x.x / 192.168.x.x)
#   TLS 1.2+ uniquement
#   Headers de sécurité HTTP
#   Anti-slowloris : timeouts courts sur header/body du client
#   limit_conn borne les streams SSE concurrents par IP (DoS GPU)
#   Journal d'accès rédigé : aucun nom d'utilisateur en clair (SEC-016)

upstream llm_gateway {
    server 127.0.0.1:8000;
    keepalive 32;
    keepalive_timeout 60s;
}

# Zone de rate-limiting nginx (defense-in-depth, complément au rate limiting applicatif)
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;
# Zone de limitation des connexions concurrentes (borne les streams SSE par IP)
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

# ── Journal d'accès rédigé (SEC-016) ──────────────────────────────────────────
# AGENTS.md § Security Rules (SEC-008) : « Never log a username, an email, or the
# free-text notes field ». SEC-010 a posé un filtre sur le logger `uvicorn.access`
# côté Python (`gateway/main.py`, `_UvicornAccessRedactor`). Mais nginx est DEVANT
# et tient SON propre journal, indépendant : le format `combined` par défaut écrit
# `$request`, c'est-à-dire la ligne de requête brute — méthode, URI COMPLÈTE et
# query string. Un opérateur qui appelle
#   GET /admin/users/Jean-Dupont
#   GET /admin/usage?username=Jean-Dupont      (ce que fait deploy/smoke_test.sh)
# écrivait donc ce nom en clair dans /var/log/nginx/access.log, ce qui vide
# l'anonymisation RGPD (DEC-001) de son sens : la ligne `users` est effacée, le
# journal en garde copie.
#
# Arbitrage : `access_log off` fermerait la fuite mais rendrait tout diagnostic
# d'incident impossible. On garde donc le journal, en remplaçant `$request` par
# une reconstruction rédigée. Ce qui RESTE : adresse cliente, horodatage,
# méthode, forme de la route, protocole, statut, volume, durée, user-agent.
# Ce qui DISPARAÎT : le seul segment de chemin et les seules valeurs de
# paramètres qui peuvent porter un nom.
#
# Deux variables `$http_*` de `combined` sont retirées volontairement :
#   - `$remote_user` : jamais renseigné ici (l'authentification est applicative,
#     par clé Bearer) — mais il porterait un identifiant si un opérateur ajoutait
#     un `auth_basic` un jour ;
#   - `$http_referer` : contrôlé par le navigateur et susceptible de recopier
#     l'URI d'une page admin, donc un nom, en contournant toute la rédaction.
# `$request_body` n'est PAS journalisé : c'est par lui que transitent `email` et
# le champ libre `notes` (POST/PATCH /admin/users). Ne pas l'ajouter.

# Chemin rédigé. On dérive de `$uri` et NON de `$request_uri` : `$uri` est
# normalisé et pourcent-décodé, donc `/admin/users/%4Aean` y devient
# `/admin/users/Jean` et tombe bien dans la règle ci-dessous — la forme brute
# permettrait d'échapper à la regex. C'est aussi ce que voit le filtre uvicorn,
# qui lit `scope["path"]` (décodé) : les deux côtés rédigent la même chaîne.
#
# Routes visées, telles qu'exposées par gateway/admin.py :
#   GET|PATCH|DELETE /admin/users/{username}
#   GET|POST         /admin/users/{username}/keys
# La règle générique est placée EN DERNIER et sert de filet : toute
# sous-ressource ajoutée demain sous /admin/users/{username}/… est rédigée par
# défaut (elle perd juste son suffixe dans le journal). Le défaut est donc
# fail-closed, comme la liste d'autorisation des paramètres ci-dessous.
# `/admin/users` (liste) et `/admin/keys/{key_prefix}` ne portent pas de nom :
# ils ne sont pas rédigés. Le préfixe de clé n'est pas un secret et l'applicatif
# le journalise déjà (`admin.revoke_key`).
map $uri $eva_log_path {
    default                       $uri;
    "~^/admin/users/[^/]+/keys$"  "/admin/users/<redacted>/keys";
    "~^/admin/users/[^/]+"        "/admin/users/<redacted>";
}

# Query string rédigée, sur LISTE D'AUTORISATION — miroir de
# `_LOGGABLE_QUERY_PARAMS` dans gateway/main.py. Ces cinq paramètres sont
# structurels (pagination, bornes de dates, forçage) et n'identifient personne.
# Tout le reste est rédigé, y compris un paramètre ajouté demain : le sens de la
# faute est fail-closed. `username` de `GET /admin/usage` est précisément le
# paramètre que cette liste n'autorise pas.
#
# DIVERGENCE ASSUMÉE avec le filtre uvicorn, faute de mieux en configuration
# nginx : uvicorn rédige VALEUR PAR VALEUR (`username=<redacted>&limit=100`),
# alors qu'ici la décision est prise sur la query string ENTIÈRE. Dès qu'un
# paramètre non autorisé apparaît, toute la requête devient `<redacted>` et l'on
# perd aussi les paramètres structurels qui l'accompagnaient. nginx ne sait pas
# itérer sur les paramètres dans un `map` ; la divergence va donc toujours dans
# le sens le plus conservateur, jamais l'inverse. La liste des NOMS autorisés,
# elle, est identique des deux côtés — c'est une seule politique, pas deux.
# Comparaison insensible à la casse (`~*`), comme le `nom.lower()` de main.py.
map $args $eva_log_args {
    default  "?<redacted>";
    ""       "";
    "~*^(from_date|to_date|limit|force|period)=[^&]*(&(from_date|to_date|limit|force|period)=[^&]*)*$"  "?$args";
}

# Équivalent de `combined`, `$request` remplacé par sa reconstruction rédigée, et
# `$request_time` ajouté (durée : indispensable en incident sur une passerelle
# d'inférence, absent de `combined`).
log_format eva_redacted
    '$remote_addr [$time_local] '
    '"$request_method $eva_log_path$eva_log_args $server_protocol" '
    '$status $body_bytes_sent $request_time '
    '"$http_user_agent"';

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    # HTTP/2 : volontairement ABSENT de la conf livrée (OPS-009).
    # Aucune forme de la directive n'est acceptée par tout le socle supporté :
    #   - « listen … ssl http2 » est DÉPRÉCIÉ depuis nginx 1.25.1 → deux warnings
    #     à chaque `nginx -t` et à chaque reload, qui masquent le bruit utile ;
    #   - « http2 on; » n'existe PAS avant 1.25.1 → « unknown directive », le
    #     service refuse de démarrer sur Ubuntu 22.04 LTS (nginx 1.18) comme sur
    #     Ubuntu 24.04 LTS (nginx 1.24), les deux socles supportés.
    # Un `listen` nu est la seule écriture valide partout. Sur un hôte en nginx
    # >= 1.25.1 (vérifier avec `nginx -v`), décommenter « http2 on; » ci-dessous.
    # Voir docs/deployment.md §8.
    listen 443 ssl;
    listen [::]:443 ssl;
    # http2 on;
    server_name gateway.example.com;

    # Certificat TLS émis pour ce nom DNS (ACME ou PKI interne)
    ssl_certificate     /etc/ssl/certs/llm-gateway.crt;
    ssl_certificate_key /etc/ssl/private/llm-gateway.key;

    # TLS moderne uniquement
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Taille max du body (prompts longs) — inchangé
    client_max_body_size 10m;

    # ── Anti-slowloris ────────────────────────────────────────────────────────
    # Un client doit envoyer ses headers et son body sans traîner. Ces timeouts
    # NE s'appliquent qu'à la RÉCEPTION de la requête client (pas au streaming de
    # la réponse, géré par proxy_read_timeout/proxy_send_timeout ci-dessous).
    client_header_timeout   15s;
    client_body_timeout     15s;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    # Headers de sécurité HTTP
    # `server_tokens off` : sans lui, chaque réponse — y compris les 403/404 et
    # les pages d'erreur nginx — annonce `Server: nginx/<version>`, ce qui permet
    # de cibler les CVE connues de cette version exacte. Le durcissement TLS est
    # revendiqué en tête de ce fichier : la bannière de version le contredisait.
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Journal d'accès rédigé (SEC-016), voir l'en-tête du fichier. Déclaré au
    # niveau `server` : il couvre TOUTES les locations par héritage, y compris
    # celles ajoutées plus tard, et remplace le `access_log … combined` hérité de
    # /etc/nginx/nginx.conf. Les deux `access_log off` de /health et /ready
    # restent prioritaires : ils sont plus proches, et ces sondes n'ont rien à
    # journaliser. Fichier dédié pour ne pas mélanger deux formats dans
    # access.log ; il est rotaté sans configuration supplémentaire, le logrotate
    # Debian/Ubuntu de nginx portant sur /var/log/nginx/*.log.
    access_log /var/log/nginx/llm-gateway-access.log eva_redacted;

    # ── Liste des modèles (/v1/models) ─────────────────────────────────────────
    # Route légère, non-streamante : rate-limit souple, PAS de limit_conn stricte
    # (une requête GET rapide ne doit pas consommer un slot de concurrence GPU).
    location = /v1/models {
        limit_req zone=api_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://llm_gateway;
        proxy_http_version 1.1;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ── API d'inférence streamante ────────────────────────────────────────────
    # Ces routes déclenchent l'inférence GPU et peuvent streamer (SSE) longtemps.
    # limit_conn borne les streams concurrents par IP → protège le GPU du DoS.
    #
    # `/completion` (sans préfixe /v1/) est l'endpoint natif llama.cpp documenté
    # en docs/api.md §7. Il est déclaré ICI parce qu'il tombait sinon dans le
    # « location / » de repli, qui renvoie 404 : la route était exposée par
    # FastAPI et documentée, mais injoignable à travers nginx (COR-009).
    location ~ ^(/v1/(chat/completions|completions|completion|embeddings)|/completion)$ {
        # Rate limiting nginx (60 req/min par IP, burst de 10)
        limit_req  zone=api_zone burst=10 nodelay;
        limit_req_status 429;
        # Max 4 requêtes d'inférence concurrentes par IP (borne les streams SSE)
        limit_conn api_conn 4;
        limit_conn_status 429;

        proxy_pass http://llm_gateway;

        # HTTP/1.1 requis pour le chunked transfer (streaming SSE)
        proxy_http_version 1.1;

        # CRITIQUE pour le streaming SSE : désactiver TOUT buffering
        proxy_buffering        off;
        proxy_cache            off;
        chunked_transfer_encoding on;

        # Signaler à nginx de ne pas bufferiser la réponse upstream
        add_header X-Accel-Buffering no always;

        # Timeouts généreux pour les inférences longues (NE PAS réduire : casserait
        # les générations longues et le streaming SSE). 900s : voir
        # « Dimensionnement des timeouts » en tête de fichier — une première
        # requête sur un modèle froid attend son chargement AVANT le 1er token.
        proxy_connect_timeout  10s;
        proxy_send_timeout     900s;
        proxy_read_timeout     900s;

        # Headers de forwarding
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connection keep-alive vers upstream
        proxy_set_header Connection "";
    }

    # ── Autres routes /v1/ (fallback : tokenize, rerank, etc.) ─────────────────
    # Conserve le comportement streaming/SSE d'origine par prudence, mais borné en
    # concurrence comme les routes d'inférence.
    location /v1/ {
        limit_req  zone=api_zone burst=10 nodelay;
        limit_req_status 429;
        limit_conn api_conn 4;
        limit_conn_status 429;

        proxy_pass http://llm_gateway;
        proxy_http_version 1.1;

        proxy_buffering        off;
        proxy_cache            off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;

        # Même dimensionnement que le bloc d'inférence : /v1/tokenize et
        # /v1/detokenize peuvent aussi déclencher un chargement de modèle.
        proxy_connect_timeout  10s;
        proxy_send_timeout     900s;
        proxy_read_timeout     900s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ── Health check (pas de rate limit, pas de log) ──────────────────────
    location /health {
        proxy_pass         http://llm_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        access_log         off;
    }

    # ── Readiness (non authentifiée, documentée en docs/api.md §2) ────────
    # Sonde distincte de /health : elle dit si la gateway peut SERVIR maintenant.
    # Elle tombait dans le « location / » de repli (404) alors que la doc
    # utilisateur l'annonce sur l'URL publique (COR-009).
    #
    # Non-divulgation : le corps public ne contient que des identifiants de
    # contrôle et des codes stables — aucun chemin de GGUF, aucune URL de nœud.
    # Le détail actionnable exige ADMIN_SECRET et reste donc protégé côté
    # applicatif. Rate-limitée pour qu'une sonde publique ne devienne pas un
    # levier de charge ; access_log coupé, un load balancer l'appelle en boucle.
    location = /ready {
        limit_req zone=api_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://llm_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";

        # Contrôles structurels uniquement (stat de fichiers, arithmétique VRAM) :
        # aucun chargement de modèle, donc pas de timeout long à prévoir.
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        access_log off;
    }

    # ── Admin (réseau privé uniquement) ───────────────────────────────────
    location /admin/ {
        # Restreindre aux plages IP de votre réseau privé.
        # Adapter ces plages à la configuration réseau réelle
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;

        # ── Journal d'erreur (SEC-016) ────────────────────────────────────────
        # nginx n'a PAS d'équivalent de `log_format` pour le journal d'erreur :
        # son format est figé dans le code, et chaque ligne de niveau `error`
        # traîne un contexte « client: … , request: "GET /admin/users/<nom>
        # HTTP/1.1" » — l'URI BRUTE, hors de portée des `map` ci-dessus. Trois
        # événements courants sur CE bloc l'écrivent : `access forbidden by rule`
        # (le `deny all` juste au-dessus, sur une sonde hors campus),
        # `upstream timed out` et `connect() failed`.
        # On relève donc le seuil à `crit` sur la seule location qui porte un nom
        # dans son chemin. Ce qui est perdu : le texte d'explication de nginx pour
        # ces trois cas, sur /admin/ uniquement. Ce qui reste : la même ligne dans
        # le journal d'accès rédigé, avec le statut (403, 502, 504), l'adresse
        # cliente, la durée et la route rédigée — l'événement reste visible, seul
        # son commentaire disparaît. Les routes /v1/* gardent le journal d'erreur
        # complet (niveau hérité de nginx.conf) : leurs URI sont fixes et ne
        # portent aucune donnée personnelle, et c'est là que se diagnostiquent les
        # vrais incidents d'inférence.
        error_log /var/log/nginx/error.log crit;

        proxy_pass         http://llm_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";

        # 900s et NON 30s (COR-009) : POST /admin/models/{id}/load attend le
        # chargement complet du modèle, jusqu'à 610s avec le registre livré. À
        # 30s, le bouton « Load » du dashboard affichait un 504 alors que le
        # chargement réussissait côté serveur. Voir « Dimensionnement des
        # timeouts » en tête de fichier.
        proxy_connect_timeout  10s;
        proxy_send_timeout     900s;
        proxy_read_timeout     900s;
    }

    # Bloquer tout le reste
    location / {
        return 404;
    }
}

# ── Redirection HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name gateway.example.com;

    # La redirection est servie à tout venant : elle n'annonce pas la version non
    # plus. Réglé par bloc et non au niveau `http` : un `server_tokens` déjà posé
    # dans /etc/nginx/nginx.conf ferait échouer `nginx -t` (« is duplicate »).
    server_tokens off;

    # Même journal rédigé qu'en HTTPS (SEC-016) : une redirection journalise
    # l'URI demandée exactement comme une requête servie, et `GET
    # /admin/users/<nom>` sur le port 80 écrivait donc le nom en clair avant de
    # rediriger. Le 301 continue lui à renvoyer l'URI COMPLÈTE au client
    # (`$request_uri`, non décodé) : c'est la redirection, pas le journal.
    access_log /var/log/nginx/llm-gateway-access.log eva_redacted;

    location / {
        return 301 https://$host$request_uri;
    }
}
